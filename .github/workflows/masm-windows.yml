name: MASM (Windows Native)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MASM
        uses: glslang/setup-masm@v1.4
        with:
          vs-architecture: 'x64'

      - name: Download and extract Irvine32 library
        shell: cmd
        run: |
          mkdir C:\Irvine32 2>nul
          powershell -Command "Invoke-WebRequest -Uri 'https://github.com/surferkip/asmbook/raw/main/Irvine.zip' -OutFile '$env:TEMP\Irvine.zip'"
          powershell -Command "Expand-Archive -Path '$env:TEMP\Irvine.zip' -DestinationPath 'C:\IrvineTemp' -Force"
          xcopy "C:\IrvineTemp\Irvine\Irvine32.inc" "C:\Irvine32\" /Y
          xcopy "C:\IrvineTemp\Irvine\Irvine32.lib" "C:\Irvine32\" /Y
          xcopy "C:\IrvineTemp\Irvine\*.inc" "C:\Irvine32\" /Y

      - name: Verify tools
        shell: cmd
        run: |
          ml.exe /?
          link.exe /?
          dir C:\Irvine32

      - name: Compile and run RevStr
        shell: cmd
        run: |
          ml.exe /c /I:C:\Irvine32 /Fo:RevStr.obj src\RevStr.asm
          link.exe /SUBSYSTEM:CONSOLE /LIBPATH:C:\Irvine32 /OUT:RevStr.exe RevStr.obj
          RevStr.exe
