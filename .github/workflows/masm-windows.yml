name: MASM (Windows Native)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MASM
        uses: glslang/setup-masm@v1.4
        with:
          vs-architecture: 'x64'

      - name: Download and extract Irvine32 library
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\Irvine32" | Out-Null
          Invoke-WebRequest -Uri "https://github.com/surferkip/asmbook/raw/main/Irvine.zip" -OutFile "$env:TEMP\Irvine.zip"
          Expand-Archive -Path "$env:TEMP\Irvine.zip" -DestinationPath "C:\IrvineTemp" -Force
          Copy-Item "C:\IrvineTemp\Irvine\Irvine32.inc" "C:\Irvine32\"
          Copy-Item "C:\IrvineTemp\Irvine\Irvine32.lib" "C:\Irvine32\"
          Copy-Item "C:\IrvineTemp\Irvine\*.inc" "C:\Irvine32\"
          Get-ChildItem "C:\Irvine32"
          "INCLUDE=C:\Irvine32" >> $env:GITHUB_ENV

      - name: Compile ASM files
        shell: pwsh
        run: |
          $ml = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\14.29.30133\bin\HostX64\x86\ml.exe"
          $link = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\14.29.30133\bin\HostX64\x86\link.exe"
          $kernel32 = "C:\Program Files (x86)\Windows Kits\10\lib\10.0.26100.0\um\x86\kernel32.lib"
          $user32 = "C:\Program Files (x86)\Windows Kits\10\lib\10.0.26100.0\um\x86\user32.lib"
          $irvine = "C:\Irvine32"

          $targets = @(
            "src/RevStr.asm"
          )

          foreach ($src in $targets) {
            $base = [System.IO.Path]::GetFileNameWithoutExtension($src)
            Write-Host "::group::Building $src"

            & $ml /c $src
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Failed to assemble $src"
              exit 1
            }

            & $link /SUBSYSTEM:CONSOLE /OUT:$($base).exe "$base.obj" "$irvine\Irvine32.lib" $kernel32 $user32
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Failed to link $base"
              exit 1
            }
            Write-Host "::endgroup::"
          }

      - name: Run tests
        shell: pwsh
        run: |
          $tests = @(
            @{ Name = "RevStr"; Expected = "Abraham Lincoln`nnlocniL maharbA" }
          )

          $failed = $false
          foreach ($test in $tests) {
            $exe = ".\$($test.Name).exe"
            if (-not (Test-Path $exe)) {
              Write-Host "::error::${$test.Name}.exe not found"
              $failed = $true
              continue
            }

            Write-Host "=== Running $($test.Name) ==="
            $output = (& $exe 2>&1 | Out-String) -replace '\r', ''
            Write-Host $output

            if ($output.Trim() -eq $test.Expected) {
              Write-Host "PASS: $($test.Name)"
            } else {
              Write-Host "::error::FAIL: $($test.Name)"
              Write-Host "Expected: $($test.Expected)"
              Write-Host "Got:      $($output.Trim())"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
