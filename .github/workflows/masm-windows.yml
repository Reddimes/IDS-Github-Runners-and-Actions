name: MASM (Windows Native)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MASM
        uses: glslang/setup-masm@v1.4
        with:
          vs-architecture: 'x64'

      - name: Download and extract Irvine32 library
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\Irvine32" | Out-Null
          Invoke-WebRequest -Uri "https://github.com/surferkip/asmbook/raw/main/Irvine.zip" -OutFile "$env:TEMP\Irvine.zip"
          Expand-Archive -Path "$env:TEMP\Irvine.zip" -DestinationPath "C:\IrvineTemp" -Force
          Copy-Item "C:\IrvineTemp\Irvine\Irvine32.inc" "C:\Irvine32\"
          Copy-Item "C:\IrvineTemp\Irvine\Irvine32.lib" "C:\Irvine32\"
          Copy-Item "C:\IrvineTemp\Irvine\*.inc" "C:\Irvine32\"
          Get-ChildItem "C:\Irvine32"
          "INCLUDE=C:\Irvine32" >> $env:GITHUB_ENV
          "LIB=C:\Irvine32" >> $env:GITHUB_ENV

      - name: Find ml.exe
        id: find-ml
        shell: pwsh
        run: |
          $ml = Get-ChildItem "C:\" -Recurse -Filter "ml.exe" -ErrorAction SilentlyContinue | Where-Object { $_.DirectoryName -like "*MSVC*" } | Select-Object -First 1
          if ($ml) {
            Write-Host "Found ml.exe at $($ml.FullName)"
            "ML_PATH=$($ml.FullName)" >> $env:GITHUB_ENV
            "MASM_DIR=$($ml.DirectoryName)" >> $env:GITHUB_ENV
          } else {
            Write-Error "ml.exe not found"
            exit 1
          }

      - name: Compile and run RevStr
        shell: cmd
        run: |
          "%ML_PATH%" /c /Fo:RevStr.obj src\RevStr.asm
          link.exe /SUBSYSTEM:CONSOLE /OUT:RevStr.exe RevStr.obj
          RevStr.exe
