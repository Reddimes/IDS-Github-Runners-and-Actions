name: MASM (Windows Native)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MASM
        uses: glslang/setup-masm@v1.4
        with:
          vs-architecture: 'x64'

      - name: Download and extract Irvine32 library
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\Irvine32" | Out-Null
          Invoke-WebRequest -Uri "https://github.com/surferkip/asmbook/raw/main/Irvine.zip" -OutFile "$env:TEMP\Irvine.zip"
          Expand-Archive -Path "$env:TEMP\Irvine.zip" -DestinationPath "C:\IrvineTemp" -Force
          Copy-Item "C:\IrvineTemp\Irvine\Irvine32.inc" "C:\Irvine32\"
          Copy-Item "C:\IrvineTemp\Irvine\Irvine32.lib" "C:\Irvine32\"
          Copy-Item "C:\IrvineTemp\Irvine\*.inc" "C:\Irvine32\"
          Get-ChildItem "C:\Irvine32"
          "INCLUDE=C:\Irvine32" >> $env:GITHUB_ENV

      - name: Compile and run ASM files
        shell: pwsh
        run: |
          $ml = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\14.29.30133\bin\HostX64\x86\ml.exe"
          $link = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\14.29.30133\bin\HostX64\x86\link.exe"
          $kernel32 = "C:\Program Files (x86)\Windows Kits\10\lib\10.0.26100.0\um\x86\kernel32.lib"
          $user32 = "C:\Program Files (x86)\Windows Kits\10\lib\10.0.26100.0\um\x86\user32.lib"
          $irvine = "C:\Irvine32"
          $root = $PWD.Path

          $asmFiles = Get-ChildItem -Path . -Recurse -Filter '*.asm' | Where-Object { $_.FullName -notmatch '\\\.github\\' } | Sort-Object FullName
          if (-not $asmFiles) { Write-Host "No .asm files found."; exit 0 }

          foreach ($src in $asmFiles) {
            $base = [System.IO.Path]::GetFileNameWithoutExtension($src.Name)
            Write-Host "::group::Building $($src.Name)"

            $obj = Join-Path $root "$base.obj"
            $exe = Join-Path $root "$base.exe"

            $compileOut = & $ml /c "/Fo `"$obj`"" $src.FullName 2>&1 | Out-String
            Write-Host $compileOut
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Failed to assemble $($src.Name)"
              exit 1
            }

            $linkOut = & $link /SUBSYSTEM:CONSOLE "/OUT:`"$exe`"" "$obj" "$irvine\Irvine32.lib" $kernel32 $user32 2>&1 | Out-String
            Write-Host $linkOut
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Failed to link $base"
              exit 1
            }

            Write-Host "=== Running $base ==="
            $output = (& $exe 2>&1 | Out-String) -replace '\r', ''
            Write-Host $output

            $matched = ""
            $expectedRevStr = "Abraham Lincoln`nnlocniL maharbA"
            if ($output.Trim() -eq $expectedRevStr) { $matched = "RevStr" }

            if ($matched) {
              Write-Host "PASS: $matched"
            } else {
              Write-Host "Unknown program — review output above."
            }
            Write-Host "::endgroup::"
          }
