name: MASM (Windows Native)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MASM
        uses: glslang/setup-masm@v1.4
        with:
          vs-architecture: 'x64'

      - name: Download and extract Irvine32 library
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\Irvine32" | Out-Null
          Invoke-WebRequest -Uri "https://github.com/surferkip/asmbook/raw/main/Irvine.zip" -OutFile "$env:TEMP\Irvine.zip"
          Expand-Archive -Path "$env:TEMP\Irvine.zip" -DestinationPath "C:\IrvineTemp" -Force
          Copy-Item "C:\IrvineTemp\Irvine\Irvine32.inc" "C:\Irvine32\"
          Copy-Item "C:\IrvineTemp\Irvine\Irvine32.lib" "C:\Irvine32\"
          Copy-Item "C:\IrvineTemp\Irvine\*.inc" "C:\Irvine32\"
          Get-ChildItem "C:\Irvine32"
          "INCLUDE=C:\Irvine32" >> $env:GITHUB_ENV

      - name: Replace corrupt Irvine SDK libs with real Windows Kit versions
        shell: cmd
        run: |
          copy /y "C:\Program Files (x86)\Windows Kits\10\lib\10.0.26100.0\um\x86\kernel32.lib" C:\Irvine32\
          copy /y "C:\Program Files (x86)\Windows Kits\10\lib\10.0.26100.0\um\x86\user32.lib" C:\Irvine32\

      - name: Compile and run RevStr
        shell: cmd
        run: |
          set LIB=
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x86
          "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\14.29.30133\bin\HostX64\x86\ml.exe" /c src\RevStr.asm
          "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\14.29.30133\bin\HostX64\x86\link.exe" /SUBSYSTEM:CONSOLE /OUT:RevStr.exe RevStr.obj C:\Irvine32\Irvine32.lib C:\Irvine32\kernel32.lib C:\Irvine32\user32.lib
          RevStr.exe
