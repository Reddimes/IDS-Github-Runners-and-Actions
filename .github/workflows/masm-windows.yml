name: MASM (Windows Native)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MASM
        uses: glslang/setup-masm@v1.4
        with:
          vs-architecture: 'x64'

      - name: Download and extract Irvine32 library
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\Irvine32" | Out-Null
          Invoke-WebRequest -Uri "https://github.com/surferkip/asmbook/raw/main/Irvine.zip" -OutFile "$env:TEMP\Irvine.zip"
          Expand-Archive -Path "$env:TEMP\Irvine.zip" -DestinationPath "C:\IrvineTemp" -Force
          Copy-Item "C:\IrvineTemp\Irvine\Irvine32.inc" "C:\Irvine32\"
          Copy-Item "C:\IrvineTemp\Irvine\Irvine32.lib" "C:\Irvine32\"
          Copy-Item "C:\IrvineTemp\Irvine\*.inc" "C:\Irvine32\"
          Get-ChildItem "C:\Irvine32"
          "INCLUDE=C:\Irvine32" >> $env:GITHUB_ENV

      - name: Compile
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x86
          ml /c src\RevStr.asm
          link /SUBSYSTEM:CONSOLE /OUT:RevStr.exe RevStr.obj C:\Irvine32\Irvine32.lib kernel32.lib user32.lib

      - name: Build HijackConsole tool
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          mkdir tools\ConptyCapture\publish
          cl /O2 /EHsc /Fe:tools\ConptyCapture\publish\HijackConsole.exe tools\ConptyCapture\HijackConsole.cpp

      - name: Run and capture output with ConPTY streaming
        shell: cmd
        run: tools\ConptyCapture\publish\HijackConsole.exe RevStr.exe > output.txt

      - name: Debug output
        shell: pwsh
        run: |
          if (Test-Path "output.txt") {
            $size = (Get-Item "output.txt").Length
            Write-Host "output.txt size: $size bytes"
            $raw = Get-Content "output.txt" -Raw
            Write-Host "Raw content length: $($raw.Length)"
            if ($raw -and $raw.Length -gt 0) {
              $hex = [BitConverter]::ToString([System.Text.Encoding]::UTF8.GetBytes($raw))
              Write-Host "Hex: $hex"
            } else {
              Write-Host "File is empty (0 bytes)"
            }
            Write-Host "Hex: $hex"
          } else {
            Write-Host "output.txt does not exist"
          }

      - name: Test
        shell: pwsh
        run: |
          if (-not (Test-Path "output.txt")) {
            Write-Host "##[error]FAIL: output.txt does not exist"
            exit 1
          }
          $raw = [string](Get-Content "output.txt" -Raw)
          $captured = ($raw -replace '\r', '').Trim()
          Write-Host "Captured output: [$captured]"
          $expected = "Abraham Lincoln`nnlocniL maharbA"
          if ($captured -eq $expected) {
            Write-Host "PASS: RevStr"
          } else {
            Write-Host "##[error]FAIL: RevStr - output mismatch"
            Write-Host "Expected: [$expected]"
            Write-Host "Got:      [$captured]"
            exit 1
          }
