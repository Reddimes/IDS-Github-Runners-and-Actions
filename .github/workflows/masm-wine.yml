name: MASM (Linux + Wine)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC + Wine (mstorsjo/msvc-wine)
        run: |
          set -e
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine32 python3 msitools ca-certificates
          mkdir -p /opt/msvc
          cd /opt/msvc
          git clone --depth 1 https://github.com/mstorsjo/msvc-wine.git src
          PYTHONUNBUFFERED=1 ./src/vsdownload.py --accept-license --dest /opt/msvc
          ./src/install.sh /opt/msvc
          wineboot --init
          while pgrep wineserver > /dev/null; do sleep 1; done
          sed -i \
            -e 's|^export INCLUDE="|export INCLUDE="z:\\\\opt\\\\irvine32;|' \
            -e 's|^export LIB="|export LIB="z:\\\\opt\\\\irvine32;|' \
            -e 's|^export LIBPATH="|export LIBPATH="z:\\\\opt\\\\irvine32;|' \
            /opt/msvc/bin/x86/msvcenv.sh
          echo "/opt/msvc/bin/x86" >> "$GITHUB_PATH"

      - name: Download and extract Irvine32 library
        run: |
          set -e
          IRVINE_DIR="/opt/Irvine32"
          mkdir -p "$IRVINE_DIR"
          curl -sL -o /tmp/Irvine.zip "https://github.com/surferkip/asmbook/raw/main/Irvine.zip"
          unzip -o -q /tmp/Irvine.zip -d /tmp/
          mv /tmp/Irvine "$IRVINE_DIR"
          rm -rf /tmp/Irvine.zip
          # cp "/opt/msvc/Windows Kits/10/Lib/10.0.26100.0/um/x86/kernel32.lib" "$IRVINE_DIR/"
          # cp "/opt/msvc/Windows Kits/10/Lib/10.0.26100.0/um/x86/user32.lib" "$IRVINE_DIR/"
          echo "IRVINE_DIR=$IRVINE_DIR" >> "$GITHUB_ENV"

      - name: Compile and run file
        run: |
          set -e
          IRVINE="z:\\opt\\Irvine32"
          WORKDIR=$(pwd)
          BASENAME=RevStr-input.asm
          # Convert unix path to z: wine path (z: maps to /)
          ZPATH="z:$(echo "$WORKDIR/$SRC" | sed 's|/|\\|g')"
          echo "::group::Building $SRC"

          # Compile
          ml /c /Foz:\\tmp\\${BASENAME}.obj "$ZPATH" 2>&1
          if [ $? -ne 0 ]; then
            echo "::error::Failed to assemble $SRC"
            exit 1
          fi

          # Link
          link /SUBSYSTEM:CONSOLE /OUT:z:\\tmp\\${BASENAME}.exe z:\\tmp\\${BASENAME}.obj "$IRVINE\\Irvine32.lib" "$IRVINE\\kernel32.lib" "$IRVINE\\user32.lib" 2>&1
          if [ $? -ne 0 ]; then
            echo "::error::Failed to link $BASENAME"
            exit 1
          fi

          echo "=== Running $BASENAME ==="
          ACTUAL="/tmp/${BASENAME}.out"
          script -q -c "wine z:\\tmp\\${BASENAME}.exe" /dev/null > "$ACTUAL" 2>&1
          sed -i 's/\x1b\[[?0-9;]*[a-zA-Z]//g; s/\r//g' "$ACTUAL"
          cat "$ACTUAL"
