name: Windows Assembly Redirection Test

on:
  workflow_dispatch:

jobs:
  test-asm-redirection:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download and Extract Irvine32
        shell: powershell
        run: |
          $url = "https://github.com/surferkip/asmbook/raw/refs/heads/main/Irvine.zip"
          $output = "irvine.zip"
          $dest = "C:\\Irvine32"
          Write-Host "Downloading Irvine32 from $url..."
          Invoke-WebRequest -Uri $url -OutFile $output
          Write-Host "Extracting to $dest..."
          if (!(Test-Path $dest)) {
            New-Item -ItemType Directory -Path $dest
          }
          Expand-Archive -Path $output -DestinationPath $dest -Force
          Write-Host "Extraction complete."

      - name: Compile and Link with ML/Link
        shell: powershell
        run: |
          $vcvars = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio" -Filter "vcvarsall.bat" -Recurse | Select-Object -First 1
          if (-not $vcvars) {
            Write-Error "vcvarsall.bat not found. Cannot initialize environment."
            exit 1
          }
          Write-Host "Found vcvarsall.bat at: $($vcvars.FullName)"
          
          & cmd /c "call `"$($vcvars.FullName)`" x86 && ml /c /nologo /I C:\Irvine32 src/RevStr-input.asm && link /SUBSYSTEM:CONSOLE /ENTRY:main /LIBPATH:C:\Irvine32 src/RevStr-input.obj C:\Irvine32\Irvine32.lib"

      - name: Run and Redirect (Direct)
        shell: cmd
        run: |
          src/RevStr-input.exe > output_direct.txt
          echo Redirection complete.

      - name: Check Direct Output
        shell: cmd
        run: |
          echo --- Content of output_direct.txt ---
          type output_direct.txt
          echo -------------------------------

