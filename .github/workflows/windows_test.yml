name: Windows - Testing

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  compile-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MASM
        uses: glslang/setup-masm@v1.4
        with:
          vs-architecture: 'x86'

      - name: Download and extract Irvine32 library
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/surferkip/asmbook/raw/main/Irvine.zip" -OutFile "$env:TEMP\Irvine.zip"
          Expand-Archive -Path "$env:TEMP\Irvine.zip" -DestinationPath "C:\IrvineTemp" -Force
          Move-Item -Path "C:\IrvineTemp\Irvine" -Destination "C:\Irvine32" -Force
          "INCLUDE=C:\Irvine32" >> $env:GITHUB_ENV

      - name: Compile and Link
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x86
          ml /c src\RevStr.asm
          link /SUBSYSTEM:CONSOLE /OUT:src\RevStr.exe RevStr.obj C:\Irvine32\Irvine32.lib kernel32.lib user32.lib

      - name: Test Run
        shell: cmd
        run: src\RevStr.exe

  interaction-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MASM
        uses: glslang/setup-masm@v1.4
        with:
          vs-architecture: 'x86'

      - name: Download and extract Irvine32 library
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/surferkip/asmbook/raw/main/Irvine.zip" -OutFile "$env:TEMP\Irvine.zip"
          Expand-Archive -Path "$env:TEMP\Irvine.zip" -DestinationPath "C:\IrvineTemp" -Force
          Move-Item -Path "C:\IrvineTemp\Irvine" -Destination "C:\Irvine32" -Force
          "INCLUDE=C:\Irvine32" >> $env:GITHUB_ENV

      - name: Compile and Link
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x86
          ml /c src\RevStr-input.asm
          link /SUBSYSTEM:CONSOLE /OUT:src\RevStr-input.exe RevStr-input.obj C:\Irvine32\Irvine32.lib kernel32.lib user32.lib

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          channels: conda-forge
          activate-environment: test-env
          auto-activate-base: false

      - name: Install dependencies
        shell: cmd
        run: |
          conda install -n test-env setuptools pip -y
          pip install wexpect -y

      - name: Test Run (Data-Driven Interaction)
        shell: cmd
        run: conda activate test-env && python scripts\interact.py tests\interaction_test_cases.json

      - name: Display Interaction Log
        shell: pwsh
        run: |
          if (Test-Path "tests\interaction_trace.log") {
            Get-Content "tests\interaction_trace.log" | Write-Host
          } else {
            Write-Warning "Interaction log (tests\interaction_trace.log) not found."
          }

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interaction-results
          path: tests/
