          }
          Expand-Archive -Path $output -DestinationPath $dest -Force

      - name: Compile and Link with ML/Link
        shell: powershell
        run: |
          $vcvars = Get-Childitem -Path "C:\Program Files\Microsoft Visual Studio" -Filter "vcvarsall.bat" -Recurse | Select-Object -First 1
          if (-not $vcvars) {
            Write-Error "vcvarsall.bat not found. Cannot initialize environment."
