name: Windows Assembly Sanity Check

on:
  workflow_dispatch:

jobs:
  asm-sanity-check:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MASM
        uses: glslang/setup-masm@v1.4
        with:
          vs-architecture: 'x86'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download and extract Irvine32
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\Irvine32" | Out-Null
          Invoke-WebRequest -Uri "https://github.com/surferkip/asmbook/raw/main/Irvine.zip" -OutFile "$env:TEMP\Irvine.zip"
          Expand-Archive -Path "$env:TEMP\Irvine.zip" -DestinationPath "C:\IrvineTemp" -Force
          Copy-Item "C:\IrvineTemp\Irvine\*" "C:\Irvine32\" -Force

      - name: Compile and Link
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x86
          ml /c /nologo /I C:\Irvine32 src\RevStr.asm
          link /SUBSYSTEM:CONSOLE /ENTRY:main /LIBPATH:C:\Irvine32 RevStr.obj Irvine32.lib

      - name: Test Redirection
        shell: cmd
        run: |
          echo "Hello World" > test_input.txt
          type test_input.txt | src\RevStr.exe > output.txt
          echo --- Output Content ---
          type output.txt
          echo --- End Output ---
