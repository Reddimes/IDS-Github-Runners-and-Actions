          $url = "https://github.com/surferkip/asmbook/raw/refs/heads/main/Irvine.zip"
          $output = "irvine.zip"
          $dest = "C:\\Irvine32"
          Write-Host "Downloading Irvine32 from $url..."
          Invoke-WebRequest -Uri $url -OutFile $output
          Write-Host "Extracting to $dest..."
          if (!(Test-Path $dest)) {
            New-Item -ItemType Directory -Path $dest
          }
          Expand-Archive -Path $output -DestinationPath $dest -Force
          Write-Host "Extraction complete."

      - name: Compile HijackConsole.cpp
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x86
          cl /I C:\Irvine32 tools/ConptyCapture/HijackConsole.cpp /Fe:HijackConsole.exe /link /SUBSYSTEM:CONSOLE

      - name: Compile RevStr-input.asm
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x86
          ml /c /nologo /I C:\Irvine32 src\RevStr-input.asm
          link /SUBSYSTEM:CONSOLE /ENTRY:main /LIBPATH:C:\Irvine32 src\RevStr-input.obj C:\Irvine32\Irvine\Irvine32.lib

      - name: Run and verify HijackCapture
        shell: cmd
        run: |
          HijackConsole.exe src\RevStr-input.exe > hijack_output.txt
          type hijack_output.txt
