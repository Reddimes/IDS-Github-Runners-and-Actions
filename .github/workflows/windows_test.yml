name: Windows Assembly Redirection Test

on:
  workflow_dispatch:

jobs:
  test-asm-redirection:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download and Extract Irvine32
        shell: powershell
        run: |
          $url = "https://github.com/surferkip/asmbook/raw/refs/heads/main/Irvine.zip"
          $output = "irvine.zip"
          $dest = "C:\\Irvine32"
          Write-Host "Downloading Irvine32 from $url..."
          Invoke-WebRequest -Uri $url -OutFile $output
          Write-Host "Extracting to $dest..."
          Expand-Archive -Path $output -DestinationPath $dest -Force
          Write-Host "Extraction complete."

      - name: Compile with ML (MASM)
        shell: cmd
        run: |
          ml /c /nologo /I C:\Irvine32 src/RevStr-input.asm

      - name: Run and Redirect (Direct)
        shell: cmd
        run: |
          src/RevStr-input.exe > output_direct.txt
          echo Redirection complete.

      - name: Check Direct Output
        shell: cmd
        run: |
          echo --- Content of output_direct.txt ---
          type output_direct.txt
          echo -------------------------------

  test-asm-pipe-redirection:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download and Extract Irvine32
        shell: powershell
        run: |
          $url = "https://github.com/surferkip/asmbook/raw/refs/heads/main/Irvine.zip"
          $output = "irvine.zip"
          $dest = "C:\\Irvine32"
          Invoke-WebRequest -Uri $url -OutFile $output
          Expand-Archive -Path $output -DestinationPath $dest -Force

      - name: Compile with ML (MASM)
        shell: cmd
        run: |
          ml /c /nologo /I C:\Irvine32 src/RevStr-input.asm

      - name: Run and Pipe (echo | exe > file)
        shell: cmd
        run: |
          echo hello | src/RevStr-input.exe > output_pipe.txt
          echo Pipe redirection complete.

      - name: Check Pipe Output
        shell: cmd
        run: |
          echo --- Content of output_pipe.txt ---
          type output_pipe.txt
          echo -----------------------------------

  test-echo:
    runs-on: windows-latest
    steps:
      - name: Echo to file
        shell: cmd
        run: echo "Echo redirection works on Windows" > echo_test.txt
      
      - name: Verify Echo
        shell: cmd
        run: type echo_test.txt
